# Tests on every push: the evidence calculus, triage, the ledger, signatures, replays (Python), and the web app's
# type-check, lint and build.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install fastapi==0.115.6 uvicorn==0.32.1 httpx==0.28.1 shapely==2.1.2 numpy==2.2.6 rasterio==1.4.4 pyproj==3.7.1 pillow==12.2.0 scipy==1.15.3 mercantile==1.2.1 cryptography pytest
      - run: python -m pytest -q tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vite build
